# NSE Research settings. Every number the app uses lives here; nothing is hard-coded.
# Copy to config/settings.local.yaml to override without touching this file
# (settings.local.yaml is git-ignored and is merged on top of this one).

profile:
  capital: 5000000            # trading capital in rupees (₹50,00,000)
  risk_per_trade_pct: 2.0     # max loss per trade as % of capital
  max_position_pct: 10.0      # max capital in one stock, % of capital
  holding_days_min: 5
  holding_days_max: 180
  allow_short: true           # SELL = short. Multi-day shorts need F&O (stock futures/options)
  short_requires_fno: true    # if true, SELL setups are only offered on F&O stocks

universe:
  mode: nifty500              # nifty500 | all_nse | custom
  extra_symbols: []           # always scanned in addition to the mode above
  custom_symbols: []          # used when mode = custom
  series: [EQ, BE]            # equity series kept from the bhavcopy

benchmark:
  index_name: "Nifty 500"     # name as it appears in NSE's ind_close_all file
  yahoo_ticker: "^CRSLDX"     # Yahoo ticker for the same index (fallback)

data:
  db_path: data/nse_research.duckdb
  cache_dir: data/cache
  history_years: 10
  request_delay_sec: 0.8      # pause between NSE requests; NSE throttles aggressive clients
  request_timeout_sec: 20
  max_retries: 3
  publish_hour_ist: 19        # don't expect today's files before this hour (IST)
  price_sources: [nse_udiff, nse_legacy, nse_full_bhav, yahoo]   # tried in order for each day
  delivery_sources: [nse_full_bhav, nse_mto]
  index_sources: [nse_index_close, yahoo]
  corp_action_min_change: 0.02  # prev-close vs last-close gap that counts as a split/bonus
  gap_action_min: 0.4          # an overnight gap bigger than this, not flagged by NSE, is treated as a split/bonus
  retry_window_days: 14       # daily run re-tries NSE for days that only have Yahoo data

scanner:
  dma_periods: [20, 50, 200]
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  rsi_bull_zone: [50, 70]
  rsi_bear_zone: [30, 50]
  macd: [12, 26, 9]
  macd_cross_lookback_days: 3
  atr_period: 14
  volume_avg_days: 20
  volume_spike_ratio: 2.0
  breakout_lookbacks: [20, 55]
  breakout_min_volume_ratio: 1.5
  delivery_avg_days: 20
  delivery_min_pct: 50.0
  delivery_vs_avg_ratio: 1.2
  rs_lookbacks: [63, 126]      # ~3 and ~6 months of trading days
  cross_lookback_days: 10      # golden/death cross must be this recent
  pivot_window: 5              # bars on each side for a swing high/low
  sr_lookback_days: 250
  sr_cluster_atr: 0.5          # pivots within this many ATRs merge into one level
  sr_near_atr: 1.0             # "near" support/resistance = within this many ATRs
  min_history_days: 210        # skip stocks with less history than this
  min_avg_turnover_cr: 1.0     # skip illiquid stocks (20-day avg turnover, ₹ crore)

backtest:
  universe: top_turnover        # top_turnover | all_stored | current (see README)
  top_n: 500                    # top_turnover: only the N most-traded stocks *on the signal day*
                                # (a point-in-time stand-in for "the Nifty 500 back then")
  min_avg_turnover_cr: 5.0      # point-in-time liquidity: 20-day avg turnover on the signal day, ₹ crore
  min_price: 20.0               # skip penny stocks (price on the signal day)
  min_atr_pct: 0.5              # skip if ATR < 0.5% of price (stop would sit inside costs/slippage)
  start_date: null              # null = all stored history
  stop_atr: 2.0                 # stop = entry ∓ stop_atr × ATR(14) on the signal day
  target_r: 2.0                 # target = entry ± target_r × (entry − stop)
  max_hold_days: 60             # time exit at the close after this many trading days
  slippage_bps: 10              # per side, against you (0.10%)
  one_trade_per_symbol: true    # no new entry in a stock while the same setup's trade is still open
  r_levels: [1, 2, 3]           # report "reached nR before the stop" for these
  oos_fraction: 0.3             # last 30% of the period is held out as out-of-sample
  min_trades_reliable: 30       # below this, results are labelled low confidence
  min_trades_moderate: 100
  walk_forward:
    train_years: 3              # pick stop/target on the previous 3 years, test on the next year
    stop_atr_grid: [1.5, 2.0, 3.0]
    target_r_grid: [1.5, 2.0, 3.0]
    min_train_trades: 20

costs:                          # Indian rates as of 2025. Check against your broker's contract note.
  delivery:                     # long trades (cash delivery)
    brokerage_pct: 0.03         # per order; many discount brokers charge 0 for delivery
    brokerage_cap: 20           # ₹ per order
    stt_buy_pct: 0.1
    stt_sell_pct: 0.1
    exchange_pct: 0.00297       # NSE transaction charge
    sebi_per_crore: 10
    stamp_buy_pct: 0.015
    gst_pct: 18
    dp_per_sell: 15.93          # depository charge per scrip sold
  futures:                      # short trades (stock futures)
    brokerage_pct: 0.03
    brokerage_cap: 20
    stt_buy_pct: 0.0
    stt_sell_pct: 0.02
    exchange_pct: 0.00173
    sebi_per_crore: 10
    stamp_buy_pct: 0.002
    gst_pct: 18
    dp_per_sell: 0
